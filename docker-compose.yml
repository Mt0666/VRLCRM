services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: vrlcrm-sql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      # MSSQL_SA_PASSWORD .env dosyasından env_file ile okunur (; gibi özel karakterler için)
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    networks:
      - vrlcrm

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrlcrm-web
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__Server: db,1433
      Database__Name: VRLCRM
      Database__User: sa
      # Database__Password yerine MSSQL_SA_PASSWORD .env'den env_file ile okunur
      SeedData__AdminEmail: ${SeedData__AdminEmail:-admin@vrlcrm.local}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - stock-uploads:/app/wwwroot/uploads
      - dataprotection-keys:/app/dataprotection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - vrlcrm

  # Cloudflare Tunnel — docker compose --profile tunnel up -d
  # Zero Trust > Routes > Service URL: http://web:8080
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: vrlcrm-tunnel
    profiles: ["tunnel"]
    env_file:
      - .env
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vrlcrm

  # Ofis offline HTTPS — docker compose --profile local-https up -d
  # ONCE: obtain-letsencrypt.ps1 (sertifika + caddy/runtime/Caddyfile uretir)
  # Caddy, gecerli Let's Encrypt sertifikasiyla LAN uzerinden HTTPS sunar.
  caddy:
    image: caddy:2-alpine
    container_name: vrlcrm-caddy
    profiles: ["local-https"]
    env_file:
      - .env
    environment:
      CRM_HOSTNAME: ${CRM_HOSTNAME:-crm.metevarol.com.tr}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/certs:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vrlcrm

  # Yerel DNS — internet yokken de CRM_HOSTNAME'i sunucu LAN IP'sine cozer.
  # Router DHCP: Birincil DNS = sunucu IP, Ikincil DNS = 1.1.1.1
  # CRM_HOSTNAME -> LOCAL_LAN_IP, diger tum isimler internete forward edilir.
  dns:
    image: coredns/coredns:1.11.1
    container_name: vrlcrm-dns
    profiles: ["local-https"]
    env_file:
      - .env
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped
    networks:
      - vrlcrm

networks:
  vrlcrm:
    driver: bridge

volumes:
  sqldata:
  stock-uploads:
  dataprotection-keys:
